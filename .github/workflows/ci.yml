name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile app/*.py tools/*.py tests/*.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python tests/smoke_test.py
      - run: python tests/studio_test.py
      - run: bash -n macos/launcher.sh extras/*.command scripts/package-mac.sh
      - run: bash scripts/package-mac.sh
